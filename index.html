<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahlu-Sunnah Al Islam - GitHub Mirror</title>
  
  <!-- Matching fonts from your Blogger source template -->
  <link href="https://googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://gstatic.com" rel="preconnect"/>
  <link href="https://googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet"/>

  <style>
    /* Exact color variables matching your b:skin template config */
    :root {
      --g900: #0d2818;
      --g700: #145a32;
      --g600: #1a6e3b;
      --g500: #1e8449;
      --g100: #d5f5e3;
      --g50: #eafaf1;
      --g25: #f6fcf7;
      --gold: #c8a951;
      --text: #1b2e1f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--g25); color: var(--text); font-family: 'Tajawal', sans-serif; font-size: 17px; line-height: 1.8; }
    a { color: var(--g700); font-weight: 600; text-decoration: none; }
    
    /* Top reading indicator bar */
    #readProgress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--g700), var(--gold)); width: 0%; z-index: 9999; }

    #outer-wrapper { background: #fff; width: 95%; max-width: 1150px; margin: 24px auto; border-radius: 18px; border: 1px solid var(--g100); overflow: hidden; box-shadow: 0 4px 18px rgba(20,90,50,0.06); }
    
    /* Header layout match */
    #header-wrapper { background: linear-gradient(180deg, var(--g700), var(--g600)); color: #fff; text-align: center; padding: 35px 20px; border-bottom: 4px solid var(--gold); display: flex; flex-direction: column; justify-content: center; align-items: center; }
    #header-wrapper h1 { font-family: 'Amiri', serif; font-size: 38px; color: #fff; margin-bottom: 5px; }
    #header-wrapper p { color: #d5f5e3; font-size: 15px; }

    /* Static navigation mock bar */
    #header-navigation { background: #fff; border-bottom: 1px solid var(--g100); text-align: center; }
    #header-navigation ul { list-style: none; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 10px; margin: 0 auto; }
    #header-navigation li { font-family: 'Amiri', serif; font-weight: 700; font-size: 18px; }
    #header-navigation li a { color: var(--g900); padding: 10px 18px; border-radius: 30px; display: block; transition: all 0.2s; }
    #header-navigation li a:hover { background: var(--g700); color: #fff; }

    #content-wrapper { padding: 22px; display: flex; gap: 22px; }
    #main-wrapper { width: 100%; }

    /* Target lists matching your unique 5px screenshot frame definition */
    .blog-posts { display: flex; flex-direction: column; gap: 20px; width: 100%; list-style: none; }
    
    /* Injection mapping list formatting */
    .blog-posts li { 
      background: #ffffff; 
      border: 5px solid var(--g700); 
      border-radius: 14px; 
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(20,90,50,0.08);
      font-size: 20px;
      font-family: 'Amiri', serif;
    }
    .blog-posts li a { color: var(--g700) !important; font-size: 22px; font-weight: bold; display: block; margin-bottom: 4px; }
    .blog-posts li a:hover { text-decoration: underline; }
    
    /* Footer layout match */
    #footer-wrapper { background: var(--g700); color: #cfe9d6; padding: 25px; text-align: center; font-size: 14px; border-top: 1px solid rgba(255,255,255,0.1); }
    #footer-wrapper strong { color: #fff; }

    /* Responsive grid sizing for mobile adjustments */
    @media screen and (max-width: 768px) {
      #outer-wrapper { width: 98%; margin: 10px auto; border-radius: 10px; }
      #header-wrapper h1 { font-size: 28px; }
      #header-navigation ul { flex-direction: column; gap: 2px; }
      #content-wrapper { padding: 12px; }
      .blog-posts li { padding: 16px; font-size: 18px; }
      .blog-posts li a { font-size: 19px; }
    }
  </style>
</head>
<body>

<div id="readProgress"></div>

<div id="outer-wrapper">
  <!-- Styled header area mapping title fields -->
  <header id="header-wrapper">
    <h1>Ahlu-Sunnah Al Islam</h1>
    <p>Spreading the truth. Authentic Islamic knowledge based on Quran and Sunnah.</p>
  </header>

  <!-- Centered standalone project navigation layout link paths -->
  <nav id="header-navigation">
  <!-- Matching Search Bar Widget Layout -->
  <div style="background: #fff; padding: 12px 18px; border-bottom: 1px solid var(--g100); margin-bottom: 20px;">
    <form action="https://alsunnahalislam.blogspot.com/search" method="get" style="display: flex; width: 100%;">
      <input type="text" name="q" placeholder="Search this blog..." style="width: 100%; padding: 12px 16px; border: 1px solid var(--g100); border-radius: 30px 0 0 30px; background: #f9fefb; outline: none; font-family: 'Tajawal', sans-serif;" required />
      <input type="submit" value="Search" style="background: var(--g700); color: #fff; border: none; padding: 12px 22px; border-radius: 0 30px 30px 0; font-weight: 700; cursor: pointer; font-family: 'Tajawal', sans-serif;" />
    </form>
  </div>

    <ul>
      <li><a href="https://alsunnahalislam.blogspot.com/">Blogger Home</a></li>
      <li><a href="https://alsunnahalislam.blogspot.com/p/welcome-to-blog.html">About</a></li>
      <li><a href="https://alsunnahalislam.blogspot.com/p/documents.html">Documents</a></li>
      <li><a href="https://alsunnahalislam.blogspot.com/p/media.html">Media</a></li>
    </ul>
  </nav>

  <div id="content-wrapper">
    <section id="main-wrapper">
      <!-- Target automation injection anchor block -->
    <ul class="blog-posts">
<!-- BLOG-POST-LIST:START -->
<!-- BLOG-POST-LIST:END -->
    </ul>

    </section>
  </div>

  <footer id="footer-wrapper">
    <p>© 2024–2026 <strong>Ahlu Sunnah Al Islam</strong>. All rights reserved.</p>
  </footer>
</div>

<script>
  // Active reading horizontal bar function matching footer actions
  window.addEventListener('scroll', function() {
    var doc = document.documentElement;
    var sc = (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
    document.getElementById('readProgress').style.width = sc + '%';
  }, {passive: true});
</script>

</body>
</html>
