name: Sync Blogger Posts
on:
  schedule:
    - cron: '34 */3 * * *'
  workflow_dispatch:

jobs:
  update_blog:
    name: Pull latest posts from Blogger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch RSS Feed
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://alsunnahalislam.blogspot.com/atom.xml?redirect=false&start-index=1&max-results=9999"
          readme_path: "index.html"
          max_post_count: 10
          # This custom mapping formats posts into identical Blogger grid card frames
          template: |
            <div class="post-outer">
              <div class="post hentry">
                <h3 class="post-title entry-title">
                  <a href="$url">$title</a>
                </h3>
                <div class="post-body entry-content">
                  <div class="home-snippet">$description</div>
                  <div style="text-align:center">
                    <a class="read-more" href="$url">Read more ...</a>
                  </div>
                </div>
              </div>
            </div>
