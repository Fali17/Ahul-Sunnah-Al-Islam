name: Sync Blogger Posts
on:
  schedule:
    - cron: '34 0 * * 0'
  workflow_dispatch:

jobs:
  update_blog:
    name: Pull latest posts from Blogger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch RSS Feed
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://alsunnahalislam.blogspot.com/atom.xml?redirect=false&start-index=1&max-results=9999"
          readme_path: "index.html"
          max_post_count: 60
         template: "<li><a href='$url'>$title</a></li>"
